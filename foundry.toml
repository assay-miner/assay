[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.26"
# Pinned. An unpinned evm_version drifts to a target BSC cannot execute.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./tasks" },
]
remappings = [
  "forge-std/=lib/forge-std/src/",
  # One prefix, matching the convention the vendored Flap headers already use. Carrying two
  # overlapping @openzeppelin prefixes made resolution order load-bearing, and it resolved wrong.
  "@openzeppelin/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

[fmt]
line_length = 100
tab_width = 4

[rpc_endpoints]
# Must serve state at a recent block, not just the head: a fork test reads storage at the block
# it pinned. bsc-rpc.publicnode.com answers `eth_blockNumber` and then 403s the storage read
# behind an archive paywall, which fails the suite for a reason that is not the code.
bsc = "https://bsc-dataseed.bnbchain.org"
bsc_testnet = "https://bsc-testnet-rpc.publicnode.com"
